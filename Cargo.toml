[workspace]
resolver = "2"
members = ["crates/burin-core", "crates/burin-py"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/starling-foundries/burin-core"
authors = ["Cameron Sajedi <cameronsajedi@gmail.com>"]

[profile.release]
lto = "thin"
codegen-units = 1
