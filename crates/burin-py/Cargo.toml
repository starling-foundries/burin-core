[package]
name = "burin-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "burin_core"
crate-type = ["cdylib"]

[dependencies]
burin-core = { version = "0.1.0", path = "../burin-core" }
numpy = "0.29"
pyo3 = { version = "0.29.2", features = ["abi3-py39", "extension-module"] }
rayon = "1.12"
serde_json = "1.0.151"
