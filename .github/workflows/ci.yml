name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # the determinism goldens (tests/determinism.rs) are exact, so every platform must agree to the bit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test -p burin-core
      - run: cargo test -p burin-core --release
      - run: cargo test -p burin-core --release --features parallel
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p burin-core -p burin-py --all-targets -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo check -p burin-core --target wasm32-unknown-unknown

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install maturin pytest numpy shapely
      - run: uv run maturin develop --release
      - run: uv run pytest

  fixtures:
    # the committed fixtures must be exactly what the reference implementation produces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with rhealpixdggs==0.8.6 --with shapely python tools/gen_fixtures.py
      - run: git diff --exit-code -- crates/burin-core/tests/fixtures
