[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "burin-core"
version = "0.1.0"
description = "Deterministic, equal-area coverage commitments: polygon → rHEALPix cells → 32-byte root, with openings and set algebra."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]
license = "Apache-2.0"
authors = [{ name = "Cameron Sajedi", email = "cameronsajedi@gmail.com" }]
keywords = ["dggs", "rhealpix", "geospatial", "merkle", "commitment", "equal-area", "stac"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Repository = "https://github.com/starling-foundries/burin-core"

[tool.maturin]
manifest-path = "crates/burin-py/Cargo.toml"
module-name = "burin._burin"
python-source = "python"
features = ["pyo3/abi3-py39"]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.7"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"
